name: eco_home_app
description: Aplicación móvil para EcoHome Store
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Para peticiones HTTP
  http: ^1.1.0
  # Para WebSockets (Socket.IO)
  socket_io_client: ^2.0.3
  # Para almacenar el token de forma persistente
  shared_preferences: ^2.2.2
  # Para manejo de estado (opcional pero recomendado)
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true